name: Windows R validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-r-validation:
    name: Windows R validation
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      RTF_TOOL_ROOT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install required R packages
        shell: pwsh
        run: |
          # Use the Windows binary repository configured by setup-r. The
          # end-user installer is then run as an idempotence/availability check
          # without depending on a second CRAN download path.
          Rscript -e 'install.packages(c("striprtf", "diffdf", "data.table", "testthat", "optparse"), repos = Sys.getenv("RSPM"))'
          Rscript R/install_packages.R

      - name: Run full test suite
        shell: pwsh
        run: Rscript R/run_tests.R

      - name: Prepare runner fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".ci/set1", ".ci/set2" | Out-Null
          Copy-Item "examples/clinical_table_base.rtf" ".ci/set1/table.rtf"
          Copy-Item "examples/clinical_table_changed.rtf" ".ci/set2/table.rtf"

      - name: Exercise path runner without dialogs
        shell: pwsh
        run: |
          $env:RTF_GENERATE_CHANGES = "yes"
          $set1 = (Resolve-Path "examples/clinical_table_base.rtf").Path
          $set2 = (Resolve-Path "examples/clinical_table_changed.rtf").Path
          @($set1, $set2, "", "") | Set-Content -Encoding utf8 ".ci/path-input.txt"
          $process = Start-Process -FilePath (Get-Command Rscript).Source `
            -ArgumentList "R/run_compare_paths.R" `
            -RedirectStandardInput ".ci/path-input.txt" -NoNewWindow -Wait -PassThru
          $status = $process.ExitCode
          if ($status -ne 1) {
            throw "Path runner returned $status; expected 1 for known differences."
          }
          $expected = @(
            "logs/RTF Changes/Set 1/clinical_table_base_change.csv",
            "logs/RTF Changes/Set 2/clinical_table_changed_change.csv",
            "logs/RTF Changes/Set 1/clinical_table_base_change.rtf",
            "logs/RTF Changes/Set 2/clinical_table_changed_change.rtf"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing path-runner output: $path" }
          }

      - name: Exercise file-picker runner without dialogs
        shell: pwsh
        run: |
          $env:RTF_GENERATE_CHANGES = "yes"
          $set1 = (Resolve-Path "examples/clinical_table_base.rtf").Path
          $set2 = (Resolve-Path "examples/clinical_table_changed.rtf").Path
          $process = Start-Process -FilePath (Get-Command Rscript).Source `
            -ArgumentList @("R/run_compare.R", $set1, $set2) `
            -NoNewWindow -Wait -PassThru
          $status = $process.ExitCode
          if ($status -ne 1) {
            throw "File-picker runner returned $status; expected 1 for known differences."
          }
          $expected = @(
            "logs/RTF Changes/Set 1/clinical_table_base_change.csv",
            "logs/RTF Changes/Set 2/clinical_table_changed_change.csv",
            "logs/RTF Changes/Set 1/clinical_table_base_change.rtf",
            "logs/RTF Changes/Set 2/clinical_table_changed_change.rtf"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing picker-runner output: $path" }
          }

      - name: Exercise folder runner without dialogs
        shell: pwsh
        run: |
          $env:RTF_GENERATE_CHANGES = "yes"
          $set1 = (Resolve-Path ".ci/set1").Path
          $set2 = (Resolve-Path ".ci/set2").Path
          $process = Start-Process -FilePath (Get-Command Rscript).Source `
            -ArgumentList @("R/run_compare_folder.R", $set1, $set2) `
            -NoNewWindow -Wait -PassThru
          $status = $process.ExitCode
          if ($status -ne 1) {
            throw "Folder runner returned $status; expected 1 for known differences."
          }
          $expected = @(
            "logs/RTF Changes/Set 1/table_change.csv",
            "logs/RTF Changes/Set 2/table_change.csv",
            "logs/RTF Changes/Set 1/table_change.rtf",
            "logs/RTF Changes/Set 2/table_change.rtf"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing folder-runner output: $path" }
          }

      - name: Exercise all accepted pairs in one Windows folder run
        shell: pwsh
        run: |
          $env:RTF_GENERATE_CHANGES = "yes"
          New-Item -ItemType Directory -Force -Path ".ci/multi-set1", ".ci/multi-set2" | Out-Null
          Copy-Item "tests/testthat/fixtures/value_diff_A.rtf" ".ci/multi-set1/exact_table.rtf"
          Copy-Item "tests/testthat/fixtures/value_diff_B.rtf" ".ci/multi-set2/exact_table.rtf"
          Copy-Item "tests/testthat/fixtures/value_diff_A.rtf" ".ci/multi-set1/s0ae0by0outcompe0sei.rtf"
          Copy-Item "tests/testthat/fixtures/value_diff_B.rtf" ".ci/multi-set2/s0ae0by0outcompe0aeosi.rtf"
          Copy-Item "tests/testthat/fixtures/value_diff_A.rtf" ".ci/multi-set1/s0exp0sum.rtf"
          Copy-Item "tests/testthat/fixtures/value_diff_B.rtf" ".ci/multi-set2/s0exp0sum0bystudy.rtf"

          # Reproduce screenshot4's two source patterns: stale cell controls
          # and an early row terminator inside hidden old-row-properties
          # metadata. Neither may be treated as rendered table structure.
          function Add-HiddenTableControls([string]$Path, [string]$Mode) {
            $text = [System.IO.File]::ReadAllText($Path)
            if ($Mode -eq "extra-cells") {
              $replacement = "{\*\oldcprops \cell\cell\cell}Placebo\cell"
            } else {
              $replacement = "Placebo\cell{\*\oldcprops \row\trowd\par\clmgf}"
            }
            $text = $text.Replace("Placebo\cell", $replacement)
            [System.IO.File]::WriteAllText($Path, $text)
          }
          Add-HiddenTableControls ".ci/multi-set1/exact_table.rtf" "extra-cells"
          Add-HiddenTableControls ".ci/multi-set2/exact_table.rtf" "extra-cells"
          Add-HiddenTableControls ".ci/multi-set1/s0ae0by0outcompe0sei.rtf" "early-row"
          Add-HiddenTableControls ".ci/multi-set2/s0ae0by0outcompe0aeosi.rtf" "early-row"
          Add-HiddenTableControls ".ci/multi-set1/s0exp0sum.rtf" "extra-cells"
          Add-HiddenTableControls ".ci/multi-set2/s0exp0sum0bystudy.rtf" "extra-cells"

          $set1 = (Resolve-Path ".ci/multi-set1").Path
          $set2 = (Resolve-Path ".ci/multi-set2").Path
          $process = Start-Process -FilePath (Get-Command Rscript).Source `
            -ArgumentList @("R/run_compare_folder.R", $set1, $set2) `
            -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 1) {
            throw "Multi-pair folder runner returned $($process.ExitCode); expected 1."
          }

          $expected = @(
            "logs/RTF Changes/Set 1/exact_table_change.csv",
            "logs/RTF Changes/Set 2/exact_table_change.csv",
            "logs/RTF Changes/Set 1/s0ae0by0outcompe0sei_change.csv",
            "logs/RTF Changes/Set 2/s0ae0by0outcompe0aeosi_change.csv",
            "logs/RTF Changes/Set 1/s0exp0sum_change.csv",
            "logs/RTF Changes/Set 2/s0exp0sum0bystudy_change.csv",
            "logs/RTF Changes/Set 1/exact_table_change.rtf",
            "logs/RTF Changes/Set 2/exact_table_change.rtf",
            "logs/RTF Changes/Set 1/s0ae0by0outcompe0sei_change.rtf",
            "logs/RTF Changes/Set 2/s0ae0by0outcompe0aeosi_change.rtf",
            "logs/RTF Changes/Set 1/s0exp0sum_change.rtf",
            "logs/RTF Changes/Set 2/s0exp0sum0bystudy_change.rtf"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "Missing multi-pair output: $path" }
            if ($path.EndsWith(".csv")) {
              $bytes = [System.IO.File]::ReadAllBytes($path)
              if ($bytes.Length -lt 4 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
                throw "CSV is missing its UTF-8 BOM: $path"
              }
            }
          }
          if (($expected | Where-Object { Test-Path $_ }).Count -ne 12) {
            throw "The multi-pair run did not create all 12 expected CSV/RTF files."
          }

      - name: Reparse and validate generated Windows CSVs and RTFs
        shell: pwsh
        run: |
          @'
          source("R/compare_rtf.R")

          root <- file.path("logs", "RTF Changes")
          outputs <- list.files(root, pattern = "_change\\.csv$", recursive = TRUE,
                                full.names = TRUE)
          rtf_outputs <- list.files(root, pattern = "_change\\.rtf$", recursive = TRUE,
                                    full.names = TRUE)

          stopifnot(all(file.exists(outputs)))
          stopifnot(length(outputs) == 10L)
          stopifnot(all(file.exists(rtf_outputs)))
          stopifnot(length(rtf_outputs) == 10L)
          for (path in outputs) {
            parsed <- .read_change_csv(path)
            stopifnot(nrow(parsed) > 0L)
            stopifnot(all(grepl("\\n(?:Change|NC)$", names(parsed), perl = TRUE)))

            if (any(trimws(parsed[[1]]) == "Headache")) {
              headache <- parsed[trimws(parsed[[1]]) == "Headache", , drop = FALSE]
              if (ncol(parsed) >= 3L && grepl("clinical_table|table_change", basename(path))) {
                stopifnot(headache[[2]][[1]] == "(+1, +0.5%)")
                stopifnot(headache[[3]][[1]] == "NC")
                stopifnot(any(parsed[[1]] == "Footnote changes in brackets"))
              }
            }
          }
          for (path in rtf_outputs) {
            .validate_rtf_container(.read_rtf_text(path), path)
            layout <- .rtf_cell_layout(path)
            table_ids <- unique(layout$row_index[layout$is_table == TRUE])
            stopifnot(length(table_ids) > 1L)
            header <- layout$raw_value[
              layout$is_table == TRUE & layout$row_index == table_ids[[1]]]
            stopifnot(all(grepl("\\n(?:Change|NC)$", header, perl = TRUE)))
            stopifnot(!any(grepl("^Column[[:space:]]*[0-9]+", header, perl = TRUE)))
            paragraphs <- layout$raw_value[layout$is_table == FALSE]
            has_table_number <- any(grepl(
              "(?i)\\bTable[[:space:]]+[0-9]+(?:\\.[0-9A-Za-z]+)*(?:-[0-9A-Za-z]+)*",
              paragraphs, perl = TRUE))
            if (has_table_number)
              stopifnot(any(grepl("_Change", paragraphs, fixed = TRUE)))
            stopifnot(file.info(path)$size > 100L)
          }
          '@ | Set-Content -Encoding utf8 ".ci/validate_generated_csvs.R"

          Rscript ".ci/validate_generated_csvs.R"
